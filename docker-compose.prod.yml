services:
  caddy:
    image: caddy:2-alpine
    container_name: cmir-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./apps/web:/srv/web:ro
      - caddy_data:/data
      - caddy_config:/config
    env_file:
      - .env
    depends_on:
      - api
      - mediamtx

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: cmir-mediamtx
    restart: unless-stopped
    ports:
      - "1935:1935"   # RTMP ingest for cameras / GoPro
    volumes:
      - ./apps/ingest/mediamtx.yml:/mediamtx.yml:ro
    command: /mediamtx.yml

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cmir-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - CMIR_HOST=0.0.0.0
      - CMIR_PORT=8090
      - CMIR_DATA_DIR=/app/data
      - CMIR_RTMP=rtmp://cmir-mediamtx:1935
      - CMIR_RTSP=rtsp://cmir-mediamtx:8554
    volumes:
      - ./data:/app/data
      - ./data:/app/apps/api_py/data
    depends_on:
      - mediamtx

volumes:
  caddy_data:
  caddy_config:
